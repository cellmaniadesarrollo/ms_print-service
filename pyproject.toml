[tool.poetry]
name = "print-service-public-py"
version = "0.1.0"
description = "Microservicio de impresion"
authors = ["cellmaniadesarrollo <christians9210023.tcm@gmail.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = {extras = ["standard"], version = ">=0.115.0"}
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
pydantic = ">=2.0.0"
python-dotenv = ">=1.0.0"
python-escpos = ">=3.0"
pillow = ">=10.0.0"
requests = ">=2.31.0"
libusb-package = ">=1.0.26"
pyusb = "^1.3.1"

[tool.poetry.group.dev.dependencies]
pystray = ">=0.19.5"
pyinstaller = ">=6.0.0"
pywin32 = { version = ">=306", platform = "win32" }

[tool.poetry.scripts]
dev = "app.main:start"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"